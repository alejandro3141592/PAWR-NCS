; PlatformIO Project Configuration File
;
; Broadcasting architecture baseline for the PAwR-vs-Broadcasting thesis
; comparison -- ported verbatim (2026-08-20) from the standalone
; ~/Documents/Wearable project (Arduino/Bluefruit/SoftDevice S140 stack,
; the same one referenced by ../PAwR/does-pawr-is-supported-idempotent-
; origami.md's feasibility analysis). This is deliberately a different
; toolchain from central/peripheral (Zephyr/NCS/west) -- Broadcasting's
; whole point of comparison is the original pre-PAwR stack, not a
; Zephyr reimplementation of the same idea.
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-plus
framework = arduino

monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    +<*>
    -<i2cscanner.cpp>
    -<hub_main.cpp>

lib_deps =
    sensirion/Sensirion I2C SHT4x
    protocentral/ProtoCentral MAX30205 Body Temperature Sensor Library
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library

[env:hub]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-plus
framework = arduino

monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    +<hub_main.cpp>
    -<main.cpp>
    -<i2cscanner.cpp>

lib_ignore =
    SensorManager
    MAX30205Sensor
    MAX30102Sensor
    SHT41Sensor
    spo2_algorithm
    tasks
    shared_state
    communication
