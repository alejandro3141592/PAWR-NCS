CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=y
CONFIG_BT_DEVICE_NAME="PAwR adv sample"

CONFIG_BT_MAX_CONN=1
CONFIG_BT_CENTRAL=y
CONFIG_BT_PER_ADV_SYNC_TRANSFER_SENDER=y

CONFIG_BT_PER_ADV_RSP=y

# SoftDevice Controller defaults for PAwR response buffering are sized for a
# light workload (TX=3, RX=2) and don't auto-scale with NUM_SUBEVENTS -- see
# NOTES.md 2026-08-01. Confirmed a real ~2.7x improvement (28.7% -> 10.6%
# miss rate) at 10 subevents over a 30-min soak. 6/6 was confirmed stable at
# 20-subevent scale over a full 30-min soak (also NOTES.md 2026-08-01).
#
# 2026-08-04: NUM_SUBEVENTS raised 20 -> 55 for the 50-node deployment
# target (see common/pawr_protocol.h). Scaled these proportionally
# (20->55 is 2.75x, 6*2.75 ~= 16.5, rounded to 15) as a STARTING GUESS ONLY,
# not a validated value -- explicitly flagged because this exact kind of
# guess already burned real time once: jumping from 6/6 straight to 12/12
# (only a 2x increase, no subevent-count change at all) made things *worse*
# than the stock default (zero output for a full 30-min soak), not better.
# Re-run the same incremental soak-testing methodology used to find 6/6
# (small step, short capture, then a full 30-min soak) at 55-subevent scale
# before trusting this number for anything unattended/production.
CONFIG_BT_CTLR_SDC_PERIODIC_ADV_RSP_TX_BUFFER_COUNT=15
CONFIG_BT_CTLR_SDC_PERIODIC_ADV_RSP_RX_BUFFER_COUNT=15

CONFIG_BT_REMOTE_INFO=y
CONFIG_BT_GATT_CLIENT=y

CONFIG_LOG=y

CONFIG_GPIO=y

# UART1 link to the nRF9151 gateway board (see boards/xiao_ble_nrf52840.overlay
# and ../gateway_9151) -- separate physical UART from the console (uart0,
# USB-CDC-ACM), so this doesn't compete with printk output.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# On-board flash log (Flash Circular Buffer) -- fallback record of every
# sensor_payload received over PAwR, in case the UART link to the gateway
# board or the gateway's own MQTT/LTE hop is down. Same partition mechanism
# as peripheral/prj.conf (see that file's comment: CONFIG_FCB only "depends
# on" FLASH_MAP, doesn't "select" it, so FLASH_MAP must be turned on
# explicitly too). See common/sensor_log.c.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y
