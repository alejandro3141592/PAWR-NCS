CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=y
CONFIG_BT_DEVICE_NAME="PAwR adv sample"

CONFIG_BT_MAX_CONN=1
CONFIG_BT_CENTRAL=y
CONFIG_BT_PER_ADV_SYNC_TRANSFER_SENDER=y

CONFIG_BT_PER_ADV_RSP=y

# SoftDevice Controller defaults for PAwR response buffering are sized for a
# light workload (TX=3, RX=2) and don't auto-scale with NUM_SUBEVENTS -- see
# NOTES.md 2026-08-01. TX count governs how many subevents the controller
# requests data for at once; RX count governs how many incoming responses it
# can hold before the app pulls them. First attempt at 12/12 made things
# *worse* (zero output for a full 30-min soak, see NOTES.md) -- stepping down
# to a smaller, more conservative increase and testing incrementally instead.
CONFIG_BT_CTLR_SDC_PERIODIC_ADV_RSP_TX_BUFFER_COUNT=6
CONFIG_BT_CTLR_SDC_PERIODIC_ADV_RSP_RX_BUFFER_COUNT=6

CONFIG_BT_REMOTE_INFO=y
CONFIG_BT_GATT_CLIENT=y

CONFIG_LOG=y

CONFIG_GPIO=y
