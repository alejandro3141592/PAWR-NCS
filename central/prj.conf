CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="PAwR adv sample"

# NOTE: Coded PHY support (CONFIG_BT_CTLR_PHY_CODED) is intentionally NOT
# set here -- an earlier LE Coded PHY implementation was removed 2026-08-11
# after real hardware repeatedly failed to sync with it under the old PAwR
# design, root cause never found (see NOTES.md and common/pawr_protocol.h).
# Not revisited under the new plain-GATT design (2026-08-13) -- no reason
# to expect it's needed, but also not re-tried.

CONFIG_BT_MAX_CONN=1
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y

CONFIG_BT_REMOTE_INFO=y
CONFIG_BT_GATT_CLIENT=y

# 2026-08-12: central subscribes to the peripheral's download characteristic
# for indications, which requires knowing that characteristic's CCC
# descriptor handle. Rather than a manual discovery pass for it, let
# bt_gatt_subscribe() find it automatically (ccc_handle =
# BT_GATT_AUTO_DISCOVER_CCC_HANDLE) -- one less handle this app has to
# track/discover by hand.
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

# Raises the ATT MTU ceiling from Zephyr's unnegotiated default of 23 (20
# usable bytes, only 1 sensor_payload entry per indication PDU at the
# current 12-byte payload size) so a download transfer (see
# common/pawr_protocol.h) can move many entries per PDU instead. 247 is
# comfortably inside a single LE Data Length Extension PDU (251 bytes max)
# so this shouldn't force extra L2CAP fragmentation. This is a Kconfig-level
# ceiling only -- the runtime bt_gatt_get_mtu() call (peripheral/src/main.c)
# still reflects the ACTUAL negotiated MTU, and the peripheral already
# tolerates a smaller negotiated result gracefully (falls back to fewer
# entries/PDU, not broken). Must be set the same on peripheral (see
# peripheral/prj.conf).
CONFIG_BT_L2CAP_TX_MTU=247

# (found the hard way, real hardware test, kept from the PAwR-era backfill
# work): CONFIG_BT_L2CAP_TX_MTU alone is NOT enough -- the negotiated LE ATT
# MTU actually ends up 23 anyway without this. Root cause: the LOCAL LE ATT
# MTU ceiling is MIN(BT_L2CAP_RX_MTU, BT_L2CAP_TX_MTU) (see
# subsys/bluetooth/host/att_internal.h's BT_LOCAL_ATT_MTU_UATT), and
# BT_L2CAP_RX_MTU is derived from CONFIG_BT_BUF_ACL_RX_SIZE (see
# include/zephyr/bluetooth/l2cap.h: BT_L2CAP_RX_MTU = ACL_RX_SIZE - 4-byte
# L2CAP header) -- NOT from CONFIG_BT_L2CAP_TX_MTU, despite the similar
# name. CONFIG_BT_BUF_ACL_RX_SIZE defaults to 27 when BT_SMP/BT_EATT/etc
# aren't enabled, which this app doesn't use -- giving RX_MTU = 27 - 4 = 23,
# capping the whole negotiation at 23 regardless of TX_MTU. Raising this to
# 247 + 4 (L2CAP header) = 251 fixes the actual local ceiling. Must match on
# peripheral for the same reason CONFIG_BT_L2CAP_TX_MTU does.
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Max native TX power for the nRF52840 radio (no external front-end amp on
# the XIAO board) -- default is 0 dBm. A real-hardware distance sweep
# (2026-08-08, see NOTES.md) showed PDR dropping to 71-82% by 1.5-2m at
# 0dBm; +8 dBm alone brought 1m from 82.4% to 96.9%, 1.5m from 71.0% to
# 91.9%, 2m from 78.3% to 89.0%. The single biggest, cheapest RF
# improvement found in this project's history -- kept as a baseline change
# independent of the PAwR-to-GATT pivot (this is a physical-layer setting,
# not tied to either transport design). Must be set the same on BOTH
# central and peripheral -- see the matching line in peripheral/prj.conf.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_LOG=y

CONFIG_GPIO=y

# Console UART RX (2026-08-13, see src/console_trigger.c): the operator
# switches central between INIT/DOWNLOAD mode by typing a single key over
# the same USB-CDC console printk() already uses -- needs the UART
# interrupt-driven API to actually receive those bytes, not just transmit.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_CONSOLE=y

# UART1 link to the nRF9151 gateway board (see boards/xiao_ble_nrf52840.overlay
# and ../gateway_9151) -- separate physical UART from the console (uart0,
# USB-CDC-ACM), so this doesn't compete with printk output or the console
# trigger above.

# On-board flash log (Flash Circular Buffer) -- fallback record of every
# sensor_payload downloaded from a peripheral, in case the UART link to the
# gateway board or the gateway's own MQTT/LTE hop is down. Same partition
# mechanism as peripheral/prj.conf (see that file's comment: CONFIG_FCB only
# "depends on" FLASH_MAP, doesn't "select" it, so FLASH_MAP must be turned
# on explicitly too). See common/sensor_log.c.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y
