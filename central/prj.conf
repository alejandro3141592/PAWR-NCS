CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=y
CONFIG_BT_DEVICE_NAME="PAwR adv sample"

CONFIG_BT_MAX_CONN=1
CONFIG_BT_CENTRAL=y
CONFIG_BT_PER_ADV_SYNC_TRANSFER_SENDER=y

CONFIG_BT_PER_ADV_RSP=y

# SoftDevice Controller defaults for PAwR response buffering are sized for a
# light workload (TX=3, RX=2) and don't auto-scale with NUM_SUBEVENTS -- see
# NOTES.md 2026-08-01. Confirmed a real ~2.7x improvement (28.7% -> 10.6%
# miss rate) at 10 subevents over a 30-min soak. 6/6 was confirmed stable at
# 20-subevent scale over a full 30-min soak (also NOTES.md 2026-08-01), and
# held up at 5 concurrent real nodes for a full hour (NOTES.md 2026-08-03) --
# the one instability seen there traced to a single physical peripheral, not
# this config.
#
# 2026-08-04: NUM_SUBEVENTS was temporarily raised 20 -> 55 for a 50-node
# deployment target, and these buffer counts were bumped to an untested 15/15
# linear guess to match -- flagged at the time as unvalidated, and never
# actually soak-tested at 55 subevents (see the 2026-08-05 22-node session:
# 69.74% PDR with multi-node dropout patterns consistent with that warning).
#
# 2026-08-07: reverted to 20 subevents / 17-node deployment target (see
# common/pawr_protocol.h) -- so these revert to 6/6 too, back to the value
# that's actually soak-tested at this exact subevent count, instead of
# carrying the unvalidated 15/15 guess forward for no reason.
#
# 2026-08-07 (later same day): tried stepping 6/6 -> 8/8 as an incremental
# probe for whether more buffering improves PDR at ~14-17 real concurrent
# nodes -- REVERTED, 8/8 made things worse, not better. Raw received-packet
# PDR on the nodes that did report looked fine (90.45% over ~10 min, 11
# nodes, no in-window dropouts) -- but per-node PDR only measures nodes that
# are already reporting, and it hid the real problem: 3 of the 16
# previously-connected nodes (47, 58, 63) never re-onboarded after this
# build was flashed, even 15+ minutes later, while 13/16 reconnected fine.
# This is a milder version of the same failure NOTES.md 2026-08-01 saw at
# 12/12 (there, total failure -- zero output for a full 30-min soak): some
# nodes silently fail to (re-)onboard rather than an obvious crash/hang, so
# per-node PDR alone is NOT sufficient to judge a buffer-count change --
# always also compare the full set of node IDs seen before vs. after.
# Reverted to 6/6, the only value actually confirmed clean at 20 subevents
# (1 node/30min + 5 nodes/1hr soaks, NOTES.md 2026-08-01 and 2026-08-03).
# If buffer-count tuning is revisited, treat both PDR AND "did every
# previously-connected node actually come back" as required, equally-weighted
# signals -- not just the received/expected ratio.
#
# 2026-08-07 (empirical test, stated explicitly as a test not a considered
# recommendation): tried 4/4 -- REVERTED. All 13 previously-active nodes did
# reconnect cleanly this time (no repeat of 8/8's reconnect-stall symptom),
# but overall PDR dropped to 86.82% (vs 8/8's 90.45% among the nodes that
# reported), with two nodes notably worse than their usual range (node 54:
# 41.2%, node 56: 77.4%). Matches the predicted direction from the
# 2026-08-01 history (SDK default 3/2 already gave 28.7% miss rate at half
# this subevent count) -- going below 6 trades "does everyone reconnect" for
# "how reliably do already-synced nodes get through," not a clean win.
# Back to 6/6 -- still the only value with real positive multi-hour evidence
# on both axes (full node-set recovery AND PDR) at this subevent count.
CONFIG_BT_CTLR_SDC_PERIODIC_ADV_RSP_TX_BUFFER_COUNT=6
CONFIG_BT_CTLR_SDC_PERIODIC_ADV_RSP_RX_BUFFER_COUNT=6

CONFIG_BT_REMOTE_INFO=y
CONFIG_BT_GATT_CLIENT=y

CONFIG_LOG=y

CONFIG_GPIO=y

# UART1 link to the nRF9151 gateway board (see boards/xiao_ble_nrf52840.overlay
# and ../gateway_9151) -- separate physical UART from the console (uart0,
# USB-CDC-ACM), so this doesn't compete with printk output.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# On-board flash log (Flash Circular Buffer) -- fallback record of every
# sensor_payload received over PAwR, in case the UART link to the gateway
# board or the gateway's own MQTT/LTE hop is down. Same partition mechanism
# as peripheral/prj.conf (see that file's comment: CONFIG_FCB only "depends
# on" FLASH_MAP, doesn't "select" it, so FLASH_MAP must be turned on
# explicitly too). See common/sensor_log.c.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y
