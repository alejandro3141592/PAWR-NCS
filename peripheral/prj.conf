CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# NOTE: Coded PHY support (CONFIG_BT_CTLR_PHY_CODED) is intentionally NOT
# set here -- see central/prj.conf's matching note.

# NOT what central actually scans for -- the connectable advertisement's
# BT_DATA_NAME_COMPLETE field is built at runtime instead (see adv_name/
# pawr_format_adv_name() in src/main.c), so it can include
# CONFIG_APP_CENTRAL_ID as a suffix. This Kconfig value only affects
# Zephyr's generic GAP Device Name characteristic, unused by this app's own
# advertising logic. Left at the plain (unsuffixed) name for clarity.
CONFIG_BT_DEVICE_NAME="PAwR sync sample"

CONFIG_BT_MAX_CONN=1

# Max native TX power for the nRF52840 radio -- see central/prj.conf for the
# full story. Must match central exactly.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Raises the ATT MTU ceiling -- see central/prj.conf's matching comment for
# the full story (the download characteristic needs both this and
# CONFIG_BT_BUF_ACL_RX_SIZE below to actually negotiate above 23 bytes, not
# just this one). Must match central.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251

CONFIG_LOG=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=n

CONFIG_GPIO=y

# Skin temperature (MAX30205, via the LM75-compatible in-tree driver) +
# humidity (SHT4x) sensors on the board's exposed I2C bus.
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SHT4X=y
CONFIG_LM75=y

# On-board flash log (Flash Circular Buffer) in the board's "Storage"
# partition -- the node's complete, authoritative measurement record (not a
# fallback anymore, see common/pawr_protocol.h's file header) for the
# lifetime of an experiment, retrieved during the download phase.
# CONFIG_FCB only "depends on" FLASH_MAP, it doesn't "select" it --
# FLASH_MAP must be turned on explicitly too, or it silently stays off and
# every fcb_*/flash_area_* call fails to link (confirmed the hard way: first
# attempt set CONFIG_FLASH=y + CONFIG_FCB=y only, and the build failed with
# undefined references to fcb_init/fcb_append/flash_area_write/
# flash_area_get_sectors, plus CONFIG_FLASH_MAP silently ending up "not set"
# in the generated .config despite this file requesting CONFIG_FCB=y).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y

# Retrieval of the flash log for bench debugging is done via
# CONFIG_APP_DUMP_ON_BOOT (see peripheral/Kconfig) printing plain printk()
# CSV at boot, not an interactive shell command -- CONFIG_SHELL=y hung the
# board's console completely (zero output, not even the boot banner),
# confirmed on real hardware 2026-08-03. See NOTES.md. The real
# retrieval path for actual field data is the BLE download characteristic
# (see common/pawr_protocol.h), not this fallback.
