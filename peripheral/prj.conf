CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_DEVICE_NAME="PAwR sync sample"

CONFIG_BT_MAX_CONN=1
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_PER_ADV_SYNC_TRANSFER_SENDER=y
CONFIG_BT_PER_ADV_SYNC_TRANSFER_RECEIVER=y

CONFIG_BT_PER_ADV_SYNC_RSP=y
CONFIG_BT_PER_ADV_SYNC_BUF_SIZE=247

CONFIG_LOG=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=n

CONFIG_GPIO=y

# Skin temperature (MAX30205, via the LM75-compatible in-tree driver) +
# humidity (SHT4x) sensors on the board's exposed I2C bus.
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SHT4X=y
CONFIG_LM75=y

# On-board flash log (Flash Circular Buffer) in the board's "Storage"
# partition -- fallback record of every sensor reading for long unattended
# runs, in case some responses don't make it to central over the air. See
# NOTES.md 2026-08-03. CONFIG_FCB only "depends on" FLASH_MAP, it doesn't
# "select" it -- FLASH_MAP must be turned on explicitly too, or it silently
# stays off and every fcb_*/flash_area_* call fails to link (confirmed the
# hard way: first attempt set CONFIG_FLASH=y + CONFIG_FCB=y only, and the
# build failed with undefined references to fcb_init/fcb_append/
# flash_area_write/flash_area_get_sectors, plus CONFIG_FLASH_MAP silently
# ending up "not set" in the generated .config despite this file requesting
# CONFIG_FCB=y).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y

# Retrieval of the flash log is now done via CONFIG_APP_DUMP_ON_BOOT (see
# peripheral/Kconfig) printing plain printk() CSV at boot, not an
# interactive shell command -- CONFIG_SHELL=y hung the board's console
# completely (zero output, not even the boot banner), confirmed on real
# hardware 2026-08-03. See NOTES.md.