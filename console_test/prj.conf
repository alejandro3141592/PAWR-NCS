# Minimal console-only smoke test -- see src/main.c and NOTES.md 2026-08-04.
# Deliberately does NOT include modem/LTE/MQTT/UART-receiver/flash-log --
# the point is to isolate whether gateway_9151's console problem is
# app-specific or a board/VCOM0-level issue.

CONFIG_GPIO=y

# CONFIG_SERIAL enables the general serial driver subsystem (all UART
# instances, not just uart0/console) -- also needed for uart2/diag_uart,
# see boards/nrf9151dk_nrf9151_ns.overlay.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_MAIN_STACK_SIZE=2048
