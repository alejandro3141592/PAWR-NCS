# nRF9151 modem + LTE connection management.
#
# IMPORTANT (2026-08-03, see NOTES.md): this used to set
# CONFIG_NRF_MODEM_LIB_NET_IF=y, which auto-initializes the modem library as
# a network interface at system-init time -- i.e. BEFORE main() runs, and
# therefore before this app's own uart_receiver_init() call, no matter what
# order the source code in main() visually shows. Comparing against the
# known-working ../tempUART_READER reference project (same board, same
# UART1/arduino_serial wiring, confirmed receiving real UART data) found
# this was the one structurally different thing: that project does NOT set
# NRF_MODEM_LIB_NET_IF, and instead calls nrf_modem_lib_init() manually,
# explicitly, in main() -- AFTER uart_receiver_init(). Switched to match
# that proven-working init order exactly: manual nrf_modem_lib_init() +
# lte_lc_connect_async(), both called only after the UART receiver is
# already up. Whether NET_IF auto-init actually corrupts/resets UART1's
# state, or something else about its timing, hasn't been root-caused at the
# hardware/register level -- but matching the known-working sequence is the
# fix, not a diagnosis of the underlying mechanism.
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y

# Sockets are still offloaded to the modem (nrf_modem_lib provides this
# without needing CONFIG_NRF_MODEM_LIB_NET_IF's net_if wrapper -- confirmed
# by the reference project using plain lte_lc + CONFIG_NET_SOCKETS_OFFLOAD
# with no net_if/Connection Manager involved at all).
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
# Needed for the plain POSIX names (struct pollfd, POLLIN, struct addrinfo,
# getaddrinfo(), poll()) used in src/mqtt/mqtt_publisher.c -- without this,
# zephyr/net/socket.h only exposes the zsock_-prefixed forms. Confirmed by a
# real build failure the first time this was omitted (undeclared POLLIN,
# incomplete struct pollfd/addrinfo) -- see gateway_9151/README.md.
CONFIG_POSIX_API=y

# Generic Zephyr MQTT client -- broker-agnostic (works against Mosquitto or
# any cloud broker), unlike CONFIG_NRF_CLOUD_MQTT which is nRF-Cloud-specific.
# Confirmed against C:/ncs/v3.3.0/zephyr/samples/net/mqtt_publisher/prj.conf.
CONFIG_MQTT_LIB=y
CONFIG_MQTT_KEEPALIVE=120

# TLS is opt-in via APP_MQTT_USE_TLS (see Kconfig) -- most cloud brokers
# (HiveMQ Cloud) need it, plain local Mosquitto during dev usually doesn't.
# When APP_MQTT_USE_TLS=y, also set these (mirrors
# zephyr/samples/net/mqtt_publisher/overlay-tls.conf):
#   CONFIG_MQTT_LIB_TLS=y
#   CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
#   CONFIG_MBEDTLS=y
#   CONFIG_MBEDTLS_BUILTIN=y
#   CONFIG_MBEDTLS_ENABLE_HEAP=y
#   CONFIG_MBEDTLS_HEAP_SIZE=30000
#   CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=2048
# Left commented rather than unconditionally on: TLS pulls in mbedTLS's heap
# and cert provisioning (via the modem's credential storage, `nrf_cloud_credentials`-
# style AT%CMNG, or a plain cert on the socket) which we haven't wired up yet
# -- see gateway_9151/README.md "Not yet implemented".

# UART to the PAwR central board (framed binary, see src/uart/uart_frame.h).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# On-board flash log (Flash Circular Buffer) -- fallback record of every
# UART frame received from central, in case the MQTT/LTE hop is down for a
# while. Same FCB mechanism as central/peripheral (see common/sensor_log.c),
# BUT this board additionally needs CONFIG_SETTINGS=y + CONFIG_SETTINGS_FCB=y,
# which central/peripheral don't set explicitly (they get a storage partition
# as a side effect of their BLE stack enabling one of Settings' backends).
# Confirmed the hard way, two failures deep:
#   1. CONFIG_FCB+FLASH+FLASH_MAP alone built fine on this /ns (TF-M) target
#      (matching nrf/samples/cellular/modem_trace_flash's flag set) but
#      failed to LINK with "PM_storage_partition_ID undeclared" -- Partition
#      Manager only reserves a "storage_partition"/settings_storage region
#      "if SETTINGS_FCB || SETTINGS_NVS || ..." (see
#      nrf/subsys/partition_manager/Kconfig, pm.yml.settings), gated on
#      Zephyr's Settings subsystem backend choice, not on CONFIG_FCB/
#      FLASH_MAP directly. gateway_9151 has no BLE stack to pull one of
#      those in as a side effect the way central/peripheral do.
#   2. Adding CONFIG_SETTINGS_FCB=y alone still failed with the exact same
#      link error -- it silently no-op'd because SETTINGS_FCB is defined
#      inside Zephyr's "menuconfig SETTINGS" block (zephyr/subsys/settings/
#      Kconfig), so it's implicitly gated on SETTINGS=y too, not just its
#      explicit "depends on FCB". CONFIG_SETTINGS=y was still "not set" in
#      the generated .config until added explicitly below.
# Neither SETTINGS_FCB nor SETTINGS is ever actually exercised (no
# settings_subsys_init()/handler registered anywhere in this app) -- both
# enabled purely to trigger the PM partition reservation, not to use the
# Settings API.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y

CONFIG_LOG=y
CONFIG_PRINTK=y

CONFIG_HEAP_MEM_POOL_SIZE=19000
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_FPU=y
